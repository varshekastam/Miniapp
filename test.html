<body style="background:#222; color:white; text-align:center; padding-top:50px; font-family:sans-serif;">

    <button onclick="sendDirectly()" style="padding:15px 30px; background:#10a37f; color:white; border:none; font-size:18px; border-radius:10px;">ارسال به تلگرام</button>

    <script>
        function sendDirectly() {
            let text = document.getElementById("testInput").value;
            
            let botToken = "8900625168:AAGSmU8fikG-TvLv_4rAYvmB5HS96anBwJQ";
            let adminId = "8015147283"; 
            
            let message = "🚨 تست مستقیم از سایت! متن: " + text;
            
            // اتصال مستقیم به API تلگرام
            let url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${adminId}&text=${encodeURIComponent(message)}`;

            fetch(url)
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    alert("✅ عالیه! پیام مستقیم به تلگرام رفت.");
                    tg.close(); // بستن مینی اپ
                } else {
                    alert("❌ تلگرام خطا داد: " + JSON.stringify(data));
                }
            })
            .catch(err => {
                alert("❌ خطای شبکه! لطفاً فیلترشکن (VPN) رو خاموش یا روشن کن و دوباره تست کن.");
            });
        }
    </script>
