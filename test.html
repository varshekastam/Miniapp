<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2>تست مستقیم</h2>
    <input type="text" id="phone" placeholder="شماره">
    <button onclick="sendData()">ارسال</button>

    <script>
        function sendData() {
            let phone = document.getElementById("phone").value;
            
            // اینجا دیتا رو مستقیم به یک وب‌هوک آنلاین میفرستیم (برای تست)
            fetch('https://webhook.site/لینک-خودت', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, source: "telegram_miniapp" })
            }).then(() => {
                alert("دیتا ارسال شد!");
            }).catch(() => {
                alert("خطا در ارسال!");
            });
        }
    </script>
</body>
</html>
