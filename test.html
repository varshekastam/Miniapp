<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#222; color:white; text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>تست اتصال سایت</h2>
    <p>این تست میکنه که آیا سایتت میتونه دیتا بفرسته یا نه.</p>
    
    <input type="text" id="testInput" placeholder="اینجا یه چیزی بنویس..." style="padding:10px; font-size:18px; width:80%;">
    <br><br>
    <button onclick="sendToWebhook()" style="padding:15px 30px; background:#10a37f; color:white; border:none; font-size:18px; border-radius:10px;">ارسال به وب‌هوک</button>

    <script>
        function sendToWebhook() {
            let text = document.getElementById("testInput").value;
            
            // لینک اختصاصی وب‌هوک خودت
            let webhookUrl = "https://webhook.site/d3d1d14e-d02f-48da-8c53-3147f9e22700";
            
            let data = {
                message: text,
                user: "رفیق"
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                alert("✅ دیتا به وب‌هوک ارسال شد! حالا برو سایت webhook.site رو چک کن.");
            })
            .catch(error => {
                alert("❌ خطا در ارسال! احتمالا اینترنت یا فیلترشکن مشکل داره.");
            });
        }
    </script>
</body>
</html>
